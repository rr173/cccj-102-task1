services:
  hub:
    build: .
    ports:
      - "8080:8080"   # control-plane API
      - "9100:9100"   # demo partner receiver
    volumes:
      - hub-data:/data
    environment:
      HUB_DELIVERY_TIMEOUT_MS: "5000"
      HUB_BASE_BACKOFF_MS: "500"
      HUB_MAX_BACKOFF_MS: "30000"

volumes:
  hub-data:
